<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IUB Vault</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .iub-blue { background-color: #0033A0; }
        .iub-blue-text { color: #0033A0; }
        .iub-red { background-color: #D32F2F; }
        .cuadricula {
            background-color: #ffffff;
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px), linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
            touch-action: none;
        }
        canvas { touch-action: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .hide { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800 h-[100dvh] flex flex-col overflow-hidden">

    <div id="loginScreen" class="absolute inset-0 bg-white z-50 flex flex-col justify-center items-center p-4">
        <h1 class="text-3xl font-bold iub-blue-text mb-2">IUB Vault</h1>
        <p class="text-gray-500 mb-8 text-center">Gestor Documental</p>
        <input type="password" id="pinInput" placeholder="PIN de Acceso" class="w-full max-w-xs p-3 border-2 border-gray-300 rounded text-center text-xl tracking-widest focus:border-blue-800 outline-none mb-4">
        <button id="btnLogin" class="w-full max-w-xs iub-blue text-white font-bold py-3 rounded shadow-lg">Desbloquear</button>
        <p id="loginError" class="text-red-500 mt-4 text-sm font-semibold hide">Error de conexión.</p>
    </div>

    <header class="iub-blue text-white p-4 text-center font-bold text-xl shadow-md flex justify-between items-center z-10 shrink-0">
        <span id="headerTitle">Nueva Captura</span>
        <button id="btnSync" class="text-sm bg-white iub-blue-text px-3 py-1 rounded font-bold flex items-center gap-1">
            ↻ Sync <span id="queueBadge" class="hidden bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full shadow-inner animate-pulse">0⬆</span>
        </button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 relative z-0" id="mainContainer">
        
        <div id="tabCaptura" class="tab-content active space-y-4 max-w-md mx-auto">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 iub-blue-text">Cuatrimestre</label>
                    <input type="number" id="cuatrimestreInput" value="7" class="w-full p-2 border rounded outline-none" readonly>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 iub-blue-text">Materia</label>
                    <select id="materiaSelect" class="w-full p-2 border rounded bg-white outline-none">
                        <option value="">Selecciona...</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 iub-blue-text">Modo de Captura</label>
                <select id="modoSelect" class="w-full p-2 border rounded bg-white outline-none">
                    <option value="FOTO">Cámara (Pizarra)</option>
                    <option value="NOTA_SPEN">Nota (S-Pen)</option>
                </select>
            </div>

            <div id="panelFoto" class="space-y-2">
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
                <button onclick="document.getElementById('cameraInput').click()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-4 rounded border border-gray-400 flex justify-center items-center text-lg shadow-sm">
                    📸 Abrir Cámara
                </button>
                <div id="previewContainer" class="hidden rounded border bg-gray-50 h-48 flex items-center justify-center overflow-hidden shadow-inner">
                    <img id="imagePreview" class="max-h-full max-w-full object-contain">
                </div>
            </div>

            <div id="panelSpen" class="hidden space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs iub-blue-text font-semibold">Modo S-Pen Activado</span>
                    <button id="btnLimpiarCanvas" class="text-xs text-red-500 font-semibold px-2 py-1 border border-red-500 rounded">Limpiar</button>
                </div>
                <div class="border-2 border-gray-300 rounded overflow-hidden shadow-inner">
                    <canvas id="canvasNota" width="400" height="300" class="cuadricula w-full h-64 cursor-crosshair"></canvas>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 iub-blue-text">Apuntes</label>
                <textarea id="textoNota" rows="2" class="w-full p-2 border rounded outline-none resize-none" placeholder="Contexto rápido..."></textarea>
            </div>

            <button id="btnGuardar" class="w-full iub-red text-white font-bold py-4 rounded shadow-lg text-lg tracking-wide transition-transform active:scale-95">
                🚀 Capturar Rápido
            </button>
            <div id="statusMessage" class="text-center text-sm font-semibold hidden py-2"></div>
        </div>

        <div id="tabModulos" class="tab-content max-w-md mx-auto">
            <h2 class="text-lg font-bold iub-blue-text mb-4 border-b-2 border-gray-200 pb-2">Mis Materias</h2>
            <div id="modulosGrid" class="grid grid-cols-1 gap-4"></div>
        </div>

        <div id="tabGaleria" class="tab-content max-w-md mx-auto">
            <button id="btnVolverModulos" class="mb-4 text-sm font-bold text-gray-600 border px-3 py-1 rounded bg-white shadow-sm">← Volver a Módulos</button>
            <h2 id="galeriaTitulo" class="text-xl font-bold iub-blue-text mb-4">Materia</h2>
            <div id="galeriaGrid" class="grid grid-cols-3 gap-2"></div>
        </div>

        <div id="tabAjustes" class="tab-content max-w-md mx-auto space-y-6">
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-bold iub-blue-text mb-4">Agregar Materia Nueva</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-gray-700">Nombre de Materia</label>
                        <input type="text" id="nuevaMateriaInput" class="w-full p-2 border rounded outline-none focus:ring-2 focus:ring-blue-800" placeholder="Ej: Circuitos II">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-gray-700">Cuatrimestre</label>
                        <input type="number" id="nuevoCuatrimestreInput" class="w-full p-2 border rounded outline-none focus:ring-2 focus:ring-blue-800" value="7">
                    </div>
                    <button id="btnAgregarMateria" class="w-full iub-blue text-white font-bold py-2 rounded shadow">
                        + Guardar Materia
                    </button>
                    <div id="ajustesStatus" class="text-center text-sm font-semibold hidden py-2"></div>
                </div>
            </div>
            
            <div class="bg-white p-4 rounded shadow">
                <h2 class="text-lg font-bold text-red-600 mb-2">Mantenimiento</h2>
                <button id="btnLimpiarCache" class="w-full bg-red-100 text-red-600 border border-red-600 font-bold py-2 rounded">
                    Limpiar Caché y Salir
                </button>
            </div>
        </div>

    </main>

    <nav class="bg-white border-t border-gray-300 flex justify-around p-2 pb-6 shadow-[0_-2px_10px_rgba(0,0,0,0.1)] z-10 shrink-0">
        <button onclick="switchTab('tabCaptura', 'Nueva Captura')" class="flex flex-col items-center w-1/4 text-gray-500 hover:iub-blue-text nav-btn active-nav">
            <span class="text-2xl">📷</span>
            <span class="text-[10px] font-semibold mt-1">Captura</span>
        </button>
        <button onclick="switchTab('tabModulos', 'Gestor de Módulos')" class="flex flex-col items-center w-1/4 text-gray-500 hover:iub-blue-text nav-btn">
            <span class="text-2xl">📚</span>
            <span class="text-[10px] font-semibold mt-1">Módulos</span>
        </button>
        <button onclick="switchTab('tabAjustes', 'Configuración')" class="flex flex-col items-center w-1/4 text-gray-500 hover:iub-blue-text nav-btn">
            <span class="text-2xl">⚙️</span>
            <span class="text-[10px] font-semibold mt-1">Ajustes</span>
        </button>
    </nav>

    <div id="imageModal" class="absolute inset-0 bg-black bg-opacity-95 z-50 hide flex flex-col">
        <div class="flex justify-between items-center p-4 shrink-0 border-b border-gray-800">
            <span id="modalDate" class="text-white text-sm font-bold"></span>
            <button id="btnCloseModal" class="text-white text-3xl font-bold">×</button>
        </div>
        
        <div class="flex-1 flex justify-center items-center p-2 overflow-hidden relative">
            <button id="btnMoveLeft" class="absolute left-2 text-white bg-black bg-opacity-50 p-3 rounded-full text-xl z-20">◀</button>
            <img id="fullImage" class="max-w-full max-h-full object-contain">
            <button id="btnMoveRight" class="absolute right-2 text-white bg-black bg-opacity-50 p-3 rounded-full text-xl z-20">▶</button>
        </div>

        <div class="bg-gray-900 flex justify-around p-3 shrink-0">
            <button id="btnShare" class="flex flex-col items-center text-blue-400 font-semibold text-xs"><span class="text-xl mb-1">📤</span>Compartir</button>
            <button id="btnDownload" class="flex flex-col items-center text-green-400 font-semibold text-xs"><span class="text-xl mb-1">⬇️</span>Descargar</button>
            <button id="btnDelete" class="flex flex-col items-center text-red-500 font-semibold text-xs"><span class="text-xl mb-1">🗑️</span>Eliminar</button>
        </div>
        
        <div id="modalNote" class="bg-white p-4 text-gray-800 text-sm overflow-y-auto max-h-32 shrink-0"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
